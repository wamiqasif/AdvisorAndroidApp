appiumServerUrl=http://127.0.0.1:4723
deviceName=emulator-5554

# ============================================================
# Automatic emulator + UiAutomator2 recovery
# ============================================================
# false = visible/headed emulator window
# true  = background/headless emulator without a window
emulatorHeadless=false

# AVD restarted automatically when emulator-5554 disappears.
avdName=Pixel_9a

# Software GPU is more stable for this API 36 emulator on this machine.
emulatorGpuMode=swiftshader

appPackage=com.valueresearch.advisor
appActivity=.MainActivity

appPin=1975

#testEmail=lalitkhatri120@gmail.com
testEmail=manishkhatri@valueresearch.in

otpAutoFetchEnabled=true
otpAutoFetch=true

#otpEmail=lalitkhatri120@gmail.com
#otpEmailAppPassword=ygqinifvglbwsmwc


otpEmail=manishkhatri@valueresearch.in
otpEmailAppPassword=aqjropclogymqnfy

otpEmailSubjectKeyword=One Time Password for Login


# =========================
# Onboarding automation data
# =========================
# Prefer environment variables in CI. ConfigReader already checks env first.

# Use a QA PAN whose onboarding state can be reset.
onboardingPan=MKLPK2070D
onboardingDob=06/03/2004
onboardingMobile=8949456905
onboardingTaxResidency=Resident Indian

# Payment setup screen: UPI Autopay / Credit card / Debit card and netbanking
onboardingPaymentMode=UPI Autopay

# Razorpay screen: PhonePe / Google Pay / Apps & UPI ID
onboardingUpiPaymentApp=PhonePe

# auto = test taps Razorpay payment app and Continue.
# manual = test waits after Authorise mandate; complete gateway manually on the phone.
# For real PhonePe/Razorpay mandate, manual is safer unless you have a test gateway/app setup.
onboardingPaymentCompletionMode=auto
onboardingManualPaymentTimeoutSeconds=180
onboardingRetryPhonePeOnce=true
onboardingAllowManualAfterGatewayError=true
onboardingGatewayInitialWaitSeconds=45

# ============================================================
# Remaining onboarding flow: separate KYC OTP mailbox + Digio
# ============================================================

# The mailbox shown on the KYC OTP screen can be different from testEmail/otpEmail.
# For Gmail, use a Gmail App Password, not the normal Gmail password.
# Prefer environment variables for passwords in CI:
#   KYC_OTP_EMAIL
#   KYC_OTP_EMAIL_APP_PASSWORD
kycOtpEmail=lalitkhatri120@gmail.com
kycOtpEmailAppPassword=ygqinifvglbwsmwc

# IMAP settings. Gmail defaults are already supplied by the code.
kycOtpImapHost=imap.gmail.com
kycOtpImapPort=993
kycOtpTimeoutSeconds=120
kycOtpRecentMessageLimit=30

# Pipe-separated subject keywords. Set blank to inspect every recent email.
kycOtpEmailSubjectKeyword=OTP to verify your KYC MANISH KHATRI (staging)

# Optional sender filter. Keep blank until you know the exact sender.
kycOtpSenderKeyword=

# Digio handling: WebView first, native accessibility second, bounded coordinate fallback last.
onboardingAllowDigioCoordinateFallback=true

# The screenshot shows the Digio checkbox already selected. Keep this false to avoid unchecking it.
# Change to true only when your run shows an unticked checkbox and the WebView cannot be attached.
onboardingDigioTapCheckboxInCoordinateFallback=false

# Coordinate fallback percentages for the same portrait layout shown in Appium Inspector.
onboardingDigioCheckboxXPercent=8
onboardingDigioCheckboxYPercent=81
onboardingDigioSignXPercent=50
onboardingDigioSignYPercent=87

# Optional exact/partial text visible after successful signing.
# Example: Subscription activated, Go to dashboard, Agreement signed
onboardingFinalSuccessMarker=


# QA execution/synchronization profile
executionProfile=qa

waitShortSeconds=8
waitDefaultSeconds=35
waitLongSeconds=60
waitPollingMillis=300

# UiAutomator2 QA stability
appiumWaitForIdleTimeoutMs=750
appiumWaitForSelectorTimeoutMs=4000

# Keep disabled on QA
fastModeEnabled=false