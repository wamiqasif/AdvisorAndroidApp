# ============================================================
# Advisory API Configuration
# Fund Review API + Fund Opinion API
# ============================================================

# Shared base URL (same host for both APIs)
advisory.api.baseUrl=https://qaappapi.valueresearch.in
#advisory.api.baseUrl=https://uatappapi.valueresearchonline.com

# Fund Review API
# Endpoint: /api/v1/advisory/fund-review?label-ids={labelId}
advisory.fund.review.endpoint=/api/v1/advisory/fund-review
advisory.fund.review.labelId=89660373

# Fund Opinion API
# Endpoint: /api/v1/funds/fund-opinion-data/get-list?plan_id={csv}
advisory.fund.opinion.endpoint=/api/v1/funds/fund-opinion-data/get-list

# Shared auth token (Bearer) — leave blank if unauthenticated
advisory.api.authToken=

# HTTP connection timeout in seconds
advisory.api.timeoutSeconds=30
