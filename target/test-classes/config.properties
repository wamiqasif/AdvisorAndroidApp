executionType=emulator

# -------------------------------------------------------
# Emulator device configuration
# -------------------------------------------------------
emulator.deviceName=Small_Phone
emulator.udid=emulator-5554
emulator.platformVersion=15

# -------------------------------------------------------
# Real device configuration
# -------------------------------------------------------
real.deviceName=
real.udid=K75LKVAQMVTKNNEI
