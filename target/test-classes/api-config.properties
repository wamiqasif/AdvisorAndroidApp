# ============================================================
# Fund Review API Configuration
# ============================================================
# Base URL of the ValueResearch Advisor backend
fund.review.api.baseUrl=https://qaappapi.valueresearch.in

# Endpoint path appended to baseUrl
fund.review.api.endpoint=/v1/portfolio/fund-review

# label_id maps to investor (set to the investor's numeric ID)
fund.review.api.labelId=89660373

# Bearer token for auth header (leave blank if unauthenticated)
fund.review.api.authToken=

# Connection timeout in seconds
fund.review.api.timeoutSeconds=30
